name: Verify solutions

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - solutions/day-01-hono-workers
          - solutions/day-02-astro
          - solutions/day-03-htmx
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test --if-present
      - run: npm run build --if-present

  deno:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solutions/day-04-deno
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solutions/day-05-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

